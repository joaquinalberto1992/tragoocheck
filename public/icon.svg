<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9D34FF" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#18181B" stroke="#27272A" stroke-width="4" />

  <!-- Purple Glass Outline -->
  <path
    d="M178 108 H334 L314 316 C312 332 300 342 284 342 H228 C212 342 200 332 198 316 Z"
    fill="none"
    stroke="url(#purpleGrad)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Purple Liquid Fill with Wave -->
  <path
    d="M187 176 Q220 162 256 178 T325 176 L312 314 C310 326 300 334 284 334 H228 C212 334 202 326 200 314 Z"
    fill="url(#purpleGrad)"
  />

  <!-- Dark Cutout Behind Checkmark -->
  <path
    d="M196 244 L248 296 L368 164"
    fill="none"
    stroke="#18181B"
    stroke-width="58"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Vibrant Lime Green Checkmark -->
  <path
    d="M204 244 L248 288 L360 170"
    fill="none"
    stroke="#39E722"
    stroke-width="34"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Typography: Tragoo Check -->
  <text
    x="256"
    y="420"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="56"
    letter-spacing="-1"
  >
    <tspan fill="#9333EA">Tragoo </tspan>
    <tspan fill="#39E722">Check</tspan>
  </text>
</svg>
